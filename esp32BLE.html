<!DOCTYPE html>
<html>
<head>
    <title>ESP32 WiFi Config via BLE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 20px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }
        .connected {
            color: green;
        }
        .disconnected {
            color: red;
        }
        .log {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ESP32 WiFi Configuration</h2>
        
        <button id="connectBtn">Connect to ESP32</button>
        
        <div id="controls" style="display:none;">
            <h3>WiFi Credentials</h3>
            <input type="text" id="ssid" placeholder="WiFi SSID (Network Name)">
            <input type="password" id="password" placeholder="WiFi Password">
            <button id="sendBtn">Send Credentials</button>
        </div>
        
        <div class="status">
            <strong>Status:</strong> <span id="status">Disconnected</span>
        </div>
        
        <div class="log">
            <strong>BLE Log:</strong><br>
            <div id="log"></div>
        </div>
    </div>

    <script>
        let device;
        let server;
        let service;
        let ssidCharacteristic;
        let passwordCharacteristic;
        
        const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
        const SSID_CHAR_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";
        const PASSWORD_CHAR_UUID = "19b10002-e8f2-537e-4f6c-d104768a1214";
        
        const connectBtn = document.getElementById('connectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const ssidInput = document.getElementById('ssid');
        const passwordInput = document.getElementById('password');
        const controls = document.getElementById('controls');
        const statusSpan = document.getElementById('status');
        const logDiv = document.getElementById('log');
        
        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        connectBtn.addEventListener('click', connectToESP32);
        sendBtn.addEventListener('click', sendCredentials);
        
        async function connectToESP32() {
            try {
                addLog('Requesting BLE device...');
                statusSpan.textContent = 'Connecting...';
                
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'PetFeeder' }],
                    optionalServices: [SERVICE_UUID]
                });
                
                addLog(`Connected to device: ${device.name}`);
                
                server = await device.gatt.connect();
                addLog('GATT server connected');
                statusSpan.textContent = 'Connected to ESP32';
                statusSpan.className = 'connected';
                
                addLog(`Getting primary service: ${SERVICE_UUID}`);
                service = await server.getPrimaryService(SERVICE_UUID);
                addLog('Service found');
                
                // Get characteristics
                addLog('Getting characteristics...');
                ssidCharacteristic = await service.getCharacteristic(SSID_CHAR_UUID);
                addLog('✓ SSID characteristic found');
                
                passwordCharacteristic = await service.getCharacteristic(PASSWORD_CHAR_UUID);
                addLog('✓ Password characteristic found');
                
                controls.style.display = 'block';
                connectBtn.disabled = true;
                connectBtn.textContent = 'Connected';
                
                addLog('✅ Ready to receive credentials!');
                
            } catch (error) {
                addLog(`❌ Error: ${error.message}`);
                statusSpan.textContent = 'Connection failed: ' + error.message;
                statusSpan.className = 'disconnected';
            }
        }
        
        async function sendCredentials() {
            const ssid = ssidInput.value;
            const password = passwordInput.value;
            
            if (!ssid || !password) {
                addLog('Please enter both SSID and Password');
                return;
            }
            
            try {
                addLog(`Sending SSID: ${ssid}`);
                const encoder = new TextEncoder();
                await ssidCharacteristic.writeValue(encoder.encode(ssid));
                addLog('✓ SSID sent');
                
                addLog('Sending password...');
                await passwordCharacteristic.writeValue(encoder.encode(password));
                addLog('✓ Password sent');
                
                addLog('✅ Credentials sent successfully!');
                statusSpan.textContent = 'Credentials sent!';
                
                // Clear inputs
                ssidInput.value = '';
                passwordInput.value = '';
                
            } catch (error) {
                addLog(`❌ Send error: ${error.message}`);
                statusSpan.textContent = 'Failed to send: ' + error.message;
            }
        }
    </script>
</body>
</html>
