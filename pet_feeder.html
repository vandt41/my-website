<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.5">
    <title>Pet Feeder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="index.html">🏠 Home</a>
    <br>
    <a href="esp32BLE.html" >ESP32 BLE</a>

    <div class="page-container">

        <h2>🐾 Pet Feeder Control</h2>
        <div class="dashboard">
     
            <div class="info-box">
                <button id="reloadStatus" disabled>⟳</button>

                <p><strong>MCU:</strong>
                <span id="MCU">STM32F407VG-DISC1</span>
                </p>

                <p><strong>ESP32:</strong>
                    <span id="esp32Status">DISCONNECTED</span>
                </p>

                <p><strong>Wifi:</strong>
                    <span id="wifiStatus">DISCONNECTED</span>
                </p>

                <p><strong>BLE:</strong>
                    <span id="bleStatus">DISCONNECTED</span>
                </p>

                <p><strong>FEEDER:</strong>
                    <span id="feederStatus">OFFLINE</span>
                </p>

                <p><strong>UART:</strong>
                    <span id="uartStatus">NOT READY</span>
                </p>

                <p><strong>LED:</strong>
                    <span id="ledStatus">NOT READY</span>
                </p>

                <p><strong>BUTTON:</strong>
                    <span id="buttonStatus">NOT READY</span>
                </p>

                <p><strong>RTC:</strong>
                    <span id="rtcStatus">NOT READY</span>
                </p>

                <p><strong>Food Level:</strong>
                    <span id="foodLevel">Unknown</span>
                </p>

                <p><strong>Last Fed:</strong>
                    <span id="lastFed">Never</span>
                </p>

                <p><strong>Next Feed:</strong>
                    <span id="nextFeed">Never</span>
                </p>

                <p><strong>ERROR:</strong>
                    <span id="errorStatus">OK</span>
                </p>

            </div>
    
            
            <div class="model-box">
                <button id="feed" disabled>Feed Now</button>

                <div id="feeder-model"></div>
                
                <div class="model-status">
                    <span id="modelStatus">Ready</span>
                </div>
            </div>
        </div>

        <br>
        


            



    </div>
    <script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

    <script type="module" src="js/visualization.js"></script>
    <script type="module" src="js/pet_feeder.js"> </script>

</body>

</html>
